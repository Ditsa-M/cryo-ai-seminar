slides:
  - id: s01
    title: "Title and central question"
    stage: null
    target_seconds: 40
    evidence: true
    labels: [EXPERIMENTAL DATA, RECOMPUTED RESULT]
    citation: "Micrograph: EMPIAR-10017 (β-galactosidase, Falcon II, 1.77 Å/px; expert coordinates by R. Henderson). Picks: Topaz 0.3.20 pretrained ResNet16, run by presenter."
    claims: [c01-empiar10017, c01-topaz-run]
    script: |-
      Let me start with a challenge. This is a real cryo-EM micrograph of beta-galactosidase from EMPIAR-10017. At first glance, can you confidently identify even one protein particle?
      
      Once I apply a low-pass filter, the particles become easier to see. The cyan outlines are particles selected by both a human expert and Topaz, a neural-network-based picker. Amber means Topaz alone selected the particle, and white means only the expert did.
      
      They agree often—but not always. That disagreement leads to my main question: where can deep learning improve cryo-EM and cryo-ET analysis, and how can we tell whether the improvement is scientifically trustworthy?
    preroll_seconds: 15
    clicks:
      - "PRE-ROLL (not in the 15:00): play the opening scene — 14 s, silent, holds on the title. Say nothing, or one line. Start your timer on the next click."
      - "Fade to the real micrograph (start speaking)."
      - "Low-pass filter fades in over the raw micrograph."
      - "Outlines appear: cyan solid = expert and Topaz agree; amber dashed = Topaz only; white dotted = expert only."
      - "Central question appears."
    source: "EMPIAR-10017 entry and data; Topaz (Bepler et al. 2019). Pick comparison recomputed by the presenter (production/data-pipeline/eval_picks.py)."
    qualification: "The micrograph is an unaligned 24-frame average from 2012 — older and noisier than modern data, which makes the point about low SNR but is not state of the art."
    deeper: "The 'expert' labels are one person's choices for a 2015 semi-automated picking paper; they were never meant to be exhaustive ground truth."
    question: "Is this micrograph simulated?"
    answer: "No. It is deposited experimental data (EMPIAR-10017). Only the low-pass filter and the outlines are computed; the label in the corner says so."

  - id: s02
    title: "Why AI-assisted processing matters"
    stage: null
    target_seconds: 50
    evidence: true
    labels: [REPORTED RESULT, CONCEPTUAL SCHEMATIC]
    citation: "Iqbal et al. 2026 BMC Artif Intell 2:2 (EMPIAR size, Jan 2025) · Dhakal et al. 2025 Brief Bioinform 26:bbaf011 Table 3 · EMPIAR-10017 metadata"
    claims: [c02-empiar-size, c02-max-picks, c02-dose, c02-henderson-rate]
    script: |-
      Why automate this process at all? There are three pressures: weak signal, enormous data volume, and human time.
      
      Radiation damages biological samples, so the total electron dose must remain limited. As a result, each particle image is extremely noisy. At the same time, modern microscopes can generate thousands of movies and very large datasets. In one benchmark dataset I will show later, Topaz selected more than four hundred thousand candidate particles. Manually examining all of them is unrealistic.
      
      But speed alone is not the goal. A false particle pick, an inaccurate motion estimate, or an aggressively enhanced map can influence every later stage—from classification and refinement to the biological conclusion. Automation is useful only when we preserve a way to detect its mistakes.
    clicks:
      - "Three numbers appear: dose, archive size, picks per dataset."
      - "Pipeline strip appears; an error marker at 'pick' propagates to 'interpret'."
    source: "Iqbal et al. 2026 (EMPIAR: 1,879 entries, 4.83 PB as of 14 Jan 2025); Dhakal et al. 2025 Table 3 (Topaz, EMPIAR-10093 full: 437,235 picks); EMPIAR-10017 metadata (24 e⁻/Å²); presenter count of 6,829 expert coordinates in 12 micrographs."
    qualification: "Archive size is a review's snapshot; it grows continuously. The 400,000 picks are one tool on one dataset, not typical of every project."
    deeper: "Dose is limited because high-energy electrons break bonds; at ~20–60 e⁻/Å² high-resolution features are already being destroyed, so you cannot simply 'expose longer'."
    question: "Isn't manual picking still the gold standard?"
    answer: "It is a useful reference but not ground truth: humans miss particles, are inconsistent between sessions, and favour obvious views. Our own comparison later shows the expert skipped real particles."

  - id: s03
    title: "What cryo-EM and cryo-ET reveal"
    stage: null
    target_seconds: 55
    evidence: true
    labels: [EXPERIMENTAL DATA, SIMULATION]
    citation: "Left: EMPIAR-10017 (experimental). Right: simulated tomogram slice from PDB 6CVM + 4V6X, ±60° tilt, presenter's deterministic simulation (seed 561). Iqbal et al. 2026."
    claims: [c03-tilt-range, c03-et-context]
    script: |-
      Before discussing the tools, I want to separate two related workflows.
      
      In single-particle cryo-EM, we image many purified copies of the same complex in different orientations. We extract and align their two-dimensional projections, then combine them into a three-dimensional reconstruction. For suitable samples, this can reach near-atomic or atomic resolution.
      
      Cryo-electron tomography is different. We tilt one region of a thicker specimen—often a cell or lamella—typically through roughly plus or minus sixty degrees, and reconstruct a three-dimensional tomogram. Because we cannot collect every tilt angle, the reconstruction contains a missing wedge of information. We can then locate repeated complexes and average their subtomograms.
      
      So single-particle analysis usually asks, “What is the molecular structure and mechanism?” Tomography also asks, “Where is this complex, what surrounds it, and what state is it in inside the cell?”
    clicks:
      - "Right panel (tomography) slides in."
      - "Question boxes appear under each panel."
    source: "Iqbal et al. 2026 (SPA vs in situ ET); TomoTwin (Rice et al. 2023) for tomogram picking context."
    qualification: "±60° is typical, not universal; dose-symmetric schemes and specimen thickness change the usable range."
    deeper: "Subtomogram averaging can reach sub-4 Å for abundant, rigid complexes such as ribosomes in situ, but most cellular targets are far lower resolution."
    question: "Why not just tilt to ±90°?"
    answer: "The holder and the grid bars block the beam, and a slab-shaped specimen gets effectively thicker with tilt (path length ∝ 1/cos θ). Beyond ~60–70° there is almost no usable signal."

  - id: s04
    title: "Fundamental image-formation principle"
    stage: null
    target_seconds: 70
    evidence: true
    labels: [SIMULATION]
    citation: "Simulation from PDB 6CVM (β-galactosidase) via ChimeraX 1.12 molmap 4 Å; 300 kV, Cs 2.7 mm, 7% amplitude contrast, 1.5 µm defocus, SNR 0.05; known poses; seed 561."
    claims: [c04-model, c04-central-slice]
    script: |-
      This equation summarizes the imaging problem. We begin with the molecule’s three-dimensional Coulomb-potential map, shown here as V. Each particle has an unknown orientation, phi-i.
      
      The microscope records a two-dimensional projection of that object. The contrast transfer function, or CTF, then modulates the Fourier components according to imaging conditions such as defocus. Some spatial frequencies change sign, and information is strongly attenuated near CTF zeros. Collecting particles at different defocus values helps provide complementary frequency information.
      
      Finally, we add noise—and at an SNR of 0.05, the particle nearly disappears.
      
      The rescue is averaging. If particles are correctly aligned and their noise is largely independent, the amplitude signal-to-noise improves approximately with the square root of the number of particles. Projections from many orientations then sample three-dimensional Fourier space, as described by the central-slice theorem.
      
      In this simulation, correlation with the true map improves as the number of views increases. But here the orientations are already known. In experimental data, estimating particle positions, orientations, motion, and optical parameters is the difficult inverse problem.
    clicks:
      - "Projection: clean views of the simulated molecule."
      - "CTF: the 1D curve and the CTF-modulated images."
      - "Noise: the same images at SNR 0.05."
      - "Averaging: 1 → 10 → 100 → 1000 aligned copies."
      - "Reconstruction: central slices from 30 → 300 → 3,000 → 30,000 views."
    source: "Central-slice theorem (DeRosier & Klug 1968, cited in Iqbal et al. 2026); CryoAI (Levy et al. 2022) formulates the same forward model."
    qualification: "Poses are known in this simulation. Real data must estimate them, which is the hard part; this is an upper bound on what averaging can do."
    deeper: "CTF(k) = −[√(1−A²)·sin χ(k) + A·cos χ(k)], χ(k) = πλΔf k² − (π/2)C_s λ³ k⁴. Defocus is varied across micrographs so that zeros fall at different k and the averaged data cover all frequencies."
    question: "If the CTF has zeros, how is that information recovered?"
    answer: "By collecting images at different defocus values: each has zeros at different frequencies, so the combined data fill the gaps. CTF correction (Wiener filtering) then weights each image by how much signal it carries at each frequency."

  - id: s05
    title: "What the raw data look like"
    stage: motion
    target_seconds: 45
    evidence: true
    labels: [EXPERIMENTAL DATA, RECOMPUTED RESULT, SIMULATION]
    citation: "Movie: EMPIAR-10204 (β-gal, CRYO ARM 200, 49 frames, 0.885 Å/px). Particles/2D classes: EMPIAR-10017, presenter's simplified classification. Map: EMD-72202 half maps. Tilt series/tomogram: simulation."
    claims: [c05-empiar10204, c05-emd72202]
    script: |-
      It is useful to distinguish what the microscope measures from what the software infers.
      
      The detector records a dose-fractionated movie. This example contains forty-nine frames. In electron-counting acquisition, fractionating the exposure allows us to estimate motion and to give less weight to high-frequency information in later, more radiation-damaged frames. After alignment and summation, we obtain a micrograph. In tomography, the corresponding measurement is a tilt series.
      
      Particle coordinates, extracted boxes, class averages, orientations, and the final density map are all inferred from those measurements.
      
      This is not a perfectly sharp boundary—the movie itself undergoes detector corrections—but it is a useful principle: a processed result is not the same thing as independent experimental evidence.
    clicks:
      - "Measured row: single frame, aligned sum, tilt series (simulated)."
      - "Inferred row: coordinates, extracted boxes, 2D classes, density map."
      - "Dividing line labelled 'measured | inferred'."
    source: "EMPIAR-10204; RELION-3 tutorial dose (1.277 e⁻/Å² per frame) for this dataset; EMPIAR-10017; EMD-72202."
    qualification: "Even the 'measured' micrograph is already processed (gain correction, alignment). The line is a gradient, not a wall."
    deeper: "Direct electron detectors made movies possible: by counting individual electrons at high frame rates they let us correct motion after the fact (Li et al. 2013)."
    question: "Why record a movie instead of one long exposure?"
    answer: "Because the specimen moves during exposure. Fractionating the dose lets you measure and undo motion, and weight early (less damaged) frames more heavily at high resolution."

  - id: s06
    title: "End-to-end workflow"
    stage: null
    target_seconds: 50
    evidence: true
    labels: [CONCEPTUAL SCHEMATIC, REPORTED RESULT]
    citation: "Iqbal et al. 2026 (workflow, Fig. 1–2, not reproduced) · Levy et al. 2022 ECCV LNCS 13681:540–557 (CryoAI) · Giri et al. 2024 Sci Data 11:458 (Cryo2StructData)"
    claims: [c06-cryoai-speed, c06-cryo2struct-size]
    script: |-
      Here is the complete workflow.
      
      For single-particle analysis, we move from movies to motion correction, CTF estimation, particle picking, extraction, two- and three-dimensional classification, refinement, post-processing, and atomic-model building.
      
      Tomography adds tilt-series alignment, tomogram reconstruction, three-dimensional particle localization, and subtomogram averaging.
      
      Deep learning now appears at many points, but not every computational step is AI. Standard motion correction and CTF estimation are still primarily driven by image statistics, physical models, and optimization.
      
      Other methods move farther downstream. CryoAI, for example, uses a learned encoder with a physics-based image-formation model to accelerate pose estimation and reconstruction. Deep-learning datasets have also been developed for training automated model-building methods.
      
      For this talk, I will focus on three stages where errors can strongly affect everything downstream: motion correction, particle picking, and map enhancement.
    clicks:
      - "SPA branch draws left to right."
      - "Cryo-ET branch splits off at reconstruction."
      - "Violet tags mark stages where DL tools exist; CryoAI and Cryo2StructData tags highlighted."
    source: "Iqbal et al. 2026; Levy et al. 2022 ('one order of magnitude faster for large datasets'); Giri et al. 2024 ('7,600 preprocessed cryo-EM density maps')."
    qualification: "CryoAI's speed-up is for homogeneous reconstruction on large datasets, compared with the solvers the authors tested; it does not handle heterogeneity."
    deeper: "Amortized inference: instead of searching all orientations for every image (like RELION's expectation–maximization), CryoAI trains one encoder that maps any image to a pose, so the cost per image falls as the dataset grows."
    question: "Is motion correction or CTF estimation done by deep learning?"
    answer: "Not in the standard tools. MotionCor2, RELION and cryoSPARC patch motion use optimization; CTFFIND and Gctf fit a physical model. I found no widely used deep-learning motion-correction method."

  - id: s07
    title: "Motion correction"
    stage: motion
    target_seconds: 60
    evidence: true
    labels: [EXPERIMENTAL DATA, RECOMPUTED RESULT]
    citation: "EMPIAR-10204 movie 20170629_00021 · presenter's simplified cross-correlation alignment (not MotionCor2) · Zheng et al. 2017 Nat Methods 14:331 · Grant & Grigorieff 2015 eLife 4:e06980"
    claims: [c07-drift, c07-conventional, c07-doseweight]
    script: |-
      First, motion. During exposure, the electron beam can deform the ice, while the specimen stage may also drift.
      
      In this real movie, the estimated displacement across forty-nine frames is about twenty-one ångströms—much larger than the high-resolution detail we hope to recover. If we simply sum the frames, the image blurs and the Thon rings in the power spectrum become weaker. After alignment, those rings become clearer, which also improves downstream CTF estimation.
      
      Local or patch-based correction can model non-uniform motion, but very small patches may contain too little signal for a reliable trajectory. Dose weighting then reduces the high-frequency contribution of later, more damaged frames.
      
      The key point is that commonly used tools such as MotionCor2, RELION Bayesian polishing, and cryoSPARC patch motion correction are not deep-learning methods. They provide a useful reminder that sophisticated automation is not automatically AI.
    clicks:
      - "Unaligned frame groups drift (plays once, holds)."
      - "Global trajectory plotted; unaligned vs aligned power spectra."
      - "Patch residual trajectories; outlier corner patch flagged amber dashed."
      - "Label: 'conventional optimization — not deep learning'."
    source: "Presenter's recomputation on EMPIAR-10204 (production/data-pipeline/motioncorr_demo.py); MotionCor2 (Zheng et al. 2017); Bayesian polishing (Zivanov et al. 2019); dose weighting (Grant & Grigorieff 2015)."
    qualification: "Our script is a teaching re-implementation; its drift estimate is not a MotionCor2 result. The 21 Å is for this one movie."
    deeper: "Errors propagate: a wrong trajectory blurs high frequencies, which damps Thon rings and degrades CTF estimation, which then mis-weights every particle downstream."
    question: "Could a neural network do motion correction better?"
    answer: "Possibly, but motion is a well-posed physical problem with strong signal from the whole frame; optimization already works well. Learned priors would risk inventing motion. I found no widely adopted DL method for it."

  - id: s08
    title: "Particle picking as an inference problem"
    stage: pick
    target_seconds: 55
    evidence: true
    labels: [EXPERIMENTAL DATA, RECOMPUTED RESULT]
    citation: "EMPIAR-10017 micrograph + expert coordinates · Topaz 0.3.20 pretrained (Bepler et al. 2019 Nat Methods 16:1153), threshold 2.0, 40 px match radius · Dhakal et al. 2025"
    claims: [c08-challenges, c08-categories]
    script: |-
      Particle picking looks like object detection, but the ground truth is unusually uncertain. Particles have low contrast; contamination can resemble protein; particles can overlap; and rare orientations may look unfamiliar. Even expert labels are not necessarily complete.
      
      I ran Topaz on twelve micrographs and compared its coordinates with expert annotations, using a seventy-one-ångström matching radius for this analysis.
      
      The two methods agreed on 6,108 particles. Topaz selected another 1,887 that were not in the expert labels, while the expert had 721 that Topaz missed.
      
      It is tempting to call every model-only pick a false positive, but that assumes the human labels are exhaustive. Some may be genuine particles the expert skipped. Also, Topaz produces ranking scores, not universally calibrated probabilities, so all these counts depend on the chosen score threshold.
    clicks:
      - "Cyan solid outlines: agreed picks."
      - "Amber dashed: model-only picks (uncertain)."
      - "White dotted: expert-only picks (missed)."
      - "Threshold label appears with its value."
    source: "Dhakal et al. 2025 (challenges: low SNR, contamination, overlap, heterogeneity); presenter's Topaz run."
    qualification: "Matching radius and threshold are our choices (40 px ≈ 71 Å; score 2.0, the best-F1 threshold). Different choices shift every count."
    deeper: "In detection terms, a 'pick' is a coordinate plus a score. The score is not a calibrated probability; it ranks candidates within a run."
    question: "Why not use the network's confidence directly?"
    answer: "Scores are ranks, not calibrated probabilities, and they shift between datasets. That is why you choose thresholds by downstream quality — 2D classes and resolution — not by the score itself."

  - id: s09
    title: "Topaz, crYOLO and TomoTwin"
    stage: pick
    target_seconds: 75
    evidence: true
    labels: [CONCEPTUAL SCHEMATIC, REPORTED RESULT]
    citation: "Bepler et al. 2019 Nat Methods 16:1153 · Wagner et al. 2019 Commun Biol 2:218 · Rice et al. 2023 Nat Methods 20:871"
    claims: [c09-topaz-pu, c09-cryolo-speed, c09-cryolo-general, c09-tomotwin-embed, c09-tomotwin-train, c09-tomotwin-limit]
    script: |-
      These three pickers represent three different learning strategies.
      
      Topaz uses positive-unlabeled learning. We label a relatively small set of particles as positive, but the rest of the micrograph is treated as unlabeled—not automatically negative—because it may contain real particles that no one clicked. A convolutional neural network produces a score map, which is converted into coordinates using a chosen threshold.
      
      crYOLO treats picking as supervised object detection. Based on the YOLO framework, it predicts particle locations and confidence scores in one pass. It can be trained for a particular dataset, while its general model was designed to work on previously unseen datasets and support rapid, on-the-fly processing.
      
      TomoTwin operates in three-dimensional tomograms. It uses deep metric learning to place small subvolumes into an embedding space, where structurally similar objects lie close together. A reference embedding can then be used to search for related particles without retraining the network for every target.
      
      However, generalization has limits. TomoTwin was trained largely with simulated examples, performance declines for small or poorly resolved targets, and closely related conformations may not separate during the initial localization step.
    clicks:
      - "Topaz column: labelled positives + unlabeled background → score map."
      - "crYOLO column: grid → boxes with confidence."
      - "TomoTwin column: subvolumes → 32-D embedding; same protein clusters."
      - "Comparison table."
    source: "Topaz: PU learning with class prior π and constraint λ; crYOLO: 'up to five micrographs per second', general model 'trained on more than 40 datasets'; TomoTwin: '37 × 37 × 37 subvolume to a 32-length feature vector', 120 proteins (108 in the curated training set), ~150 kDa expected limit, ~10 Å/px."
    qualification: "Speeds and limits are as reported by each tool's authors on their hardware and test data."
    deeper: "Metric learning trains with triplets: an anchor, a positive (same protein) and a negative (different protein). The loss pulls anchor–positive together and pushes anchor–negative apart by a margin."
    question: "Why is Topaz's 'unlabeled' not the same as 'negative'?"
    answer: "Because most unlabeled pixels near particles are particles nobody clicked. Treating them as negatives teaches the network to reject real particles. PU learning instead estimates how many positives hide in the unlabeled set."

  - id: s10
    title: "How to interpret picker output"
    stage: pick
    target_seconds: 80
    evidence: true
    labels: [RECOMPUTED RESULT]
    citation: "Presenter's Topaz 0.3.20 run on 12 EMPIAR-10017 micrographs vs 6,829 expert coordinates (40 px radius) · simplified 2D classification (not RELION/cryoSPARC) · Scheres & Chen 2012 Nat Methods 9:853"
    claims: [c10-pr-curve, c10-bestf1, c10-pu25, c10-fp-classes, c10-fsc]
    script: |-
      How should we evaluate a picker? Precision asks: of everything selected, how much appears to be real? Recall asks: of all labelled particles, how many were recovered? F1 combines the two—but all three depend on the quality and completeness of the reference labels.
      
      Here is the precision–recall trade-off for Topaz on my twelve micrographs. Lowering the threshold increases the number of picks and improves recall, but precision falls. In this comparison, threshold two gave the highest F1 score, around 0.82. After retraining on a subset of the annotations, the score improved on held-out micrographs.
      
      But the more revealing result came from classifying the supposed false positives. Several two-dimensional classes resemble genuine beta-galactosidase views, and the largest group contains overlapping neighbours. The expert labels were useful, but they were never designed to be a complete ground truth for this benchmark.
      
      So coordinate-level metrics are only the first check. We should also examine two-dimensional class quality, orientation coverage, retention of rare views, local resolution, and gold-standard FSC from independently refined half-sets. At the half-map FSC threshold of 0.143, we estimate resolution—but that number is meaningful only when half-set independence and masking are handled properly. More particles are not automatically better particles.
    clicks:
      - "Precision–recall curve draws; threshold marker moves from high to low (D3)."
      - "Best-F1 point annotated; pick count shown."
      - "2D classes: agreed picks vs 'false-positive' picks vs missed picks."
      - "Downstream checklist and FSC schematic."
    source: "Presenter's recomputation (eval_picks.py, classify2d_picks.py); FSC 0.143 criterion (Rosenthal & Henderson 2003); gold-standard half maps (Scheres & Chen 2012)."
    qualification: "Our 2D classification is a simplified teaching implementation and the 'looks like β-gal' judgement is visual, not quantified."
    deeper: "Topaz trained on only 25% of the expert labels in 8 micrographs reached best F1 0.863 on 4 held-out micrographs, vs 0.823 for the pretrained general model — PU learning in action, on real data."
    question: "Why 0.143 for the FSC threshold?"
    answer: "Half-maps each contain half the data. 0.143 for their correlation corresponds to 0.5 correlation between the full map and a perfect reference (Rosenthal & Henderson 2003). It is a convention; the shape of the whole curve matters too."

  - id: s11
    title: "DeepEMhancer and map enhancement"
    stage: enhance
    target_seconds: 70
    evidence: true
    labels: [EXPERIMENTAL DATA, RECOMPUTED RESULT]
    citation: "EMD-72202 half maps (β2AR dimer + AP-7-168) · DeepEMhancer 0.18 (Sanchez-Garcia et al. 2021 Commun Biol 4:874), run by presenter · our FSC, B-factor and local resolution (not cryoSPARC) · Iqbal et al. 2026"
    claims: [c11-demh-training, c11-fsc, c11-locres, c11-bias]
    script: |-
      Next is map enhancement, shown here for a beta-2 adrenergic receptor dimer in a nanodisc.
      
      An unsharpened reconstruction often has weak high-frequency contrast. Global B-factor sharpening boosts high frequencies with one overall correction, but map quality is spatially variable: a rigid protein core and a flexible lipid environment should not necessarily receive the same treatment.
      
      DeepEMhancer is a three-dimensional convolutional network trained on experimental maps paired with targets derived using deposited atomic models. It performs masking-like and sharpening-like operations and often produces a map that is much easier to interpret.
      
      But easier to interpret does not mean independently more accurate. The half-map FSC—and therefore the experimental resolution evidence—does not improve merely because the displayed map looks cleaner.
      
      Now look at the low contour level. The conventional maps show the nanodisc density, while DeepEMhancer strongly suppresses it. That density may be real even though it does not resemble the protein-focused training target. Therefore, an enhanced map should be treated as an interpretation aid. Atomic models should be validated against the original, independently refined half-maps, not against the enhanced map alone.
    clicks:
      - "Unsharpened average of half maps."
      - "Global B-factor sharpening (conventional)."
      - "DeepEMhancer output."
      - "Independent evidence panel: half-map FSC + local-resolution colour scale."
      - "Half contour level: nanodisc present in conventional maps, absent after DeepEMhancer."
    source: "DeepEMhancer: 'trained on a dataset of pairs of experimental maps and maps sharpened using their respective atomic models'; testing set of 20 maps. Iqbal et al. 2026: such methods 'can introduce model bias, particularly when dealing with structures underrepresented in the data'."
    qualification: "Our FSC (2.62 Å, soft mask) differs slightly from the deposited 2.5 Å because masks differ. Local resolution uses a 24-voxel window and 0.5 threshold, which is conservative."
    deeper: "Global B-factor sharpening multiplies amplitudes by exp(B·s²/4): one number for the whole map, so flexible regions get over-sharpened (noise) and rigid cores under-sharpened. DeepEMhancer and LocScale act locally."
    question: "If DeepEMhancer improves the FSC against the atomic model, isn't that proof it adds information?"
    answer: "No. Its training target was model-based maps, so agreement with a model is partly what it learned to produce. Independent evidence must come from the half maps, which the network never 'saw' separately."

  - id: s12
    title: "Literature case study: six pickers, same data"
    stage: reconstruct
    target_seconds: 70
    evidence: true
    labels: [REPORTED RESULT]
    citation: "Dhakal et al. 2025 Brief Bioinform 26:bbaf011, Table 3 — best resolution of 3 cryoSPARC trials, average across 4 test proteins; lower Å is better. Values re-plotted, not reproduced."
    claims: [c12-protocol, c12-averages, c12-counts, c12-hemagglutinin, c12-conflict, c12-orientation, c12-coi]
    script: |-
      A published comparison makes the same point at the particle-picking stage. Dhakal and colleagues evaluated six pickers on four EMPIAR datasets using a shared cryoSPARC processing workflow.
      
      The methods produced dramatically different particle counts. In the reported full-dataset comparison, Topaz selected roughly twice as many particles as CryoSegNet, yet CryoSegNet achieved a slightly better average resolution. For hemagglutinin, two methods reached approximately the same reported resolution using very different numbers of particles.
      
      So particle count alone is a poor measure of success. A smaller set can perform better if it contains cleaner particles or better coverage of viewing directions.
      
      The benchmark also has limitations: only four proteins were tested; selecting the best of several runs can favour unstable methods; and some evaluated tools came from the benchmarking group. There was even a discrepancy between one table and the written interpretation for one dataset.
      
      The right conclusion is not that one picker always wins. It is that benchmarking must include orientation coverage, reconstruction quality, robustness across datasets, and transparent reporting—not only the number of coordinates returned.
    clicks:
      - "Six pickers listed."
      - "Particle counts (full EMPIAR) appear as bars."
      - "Average resolution appears (lower is better)."
      - "Highlight: more particles ≠ better resolution (Topaz vs CryoSegNet; HA dataset)."
      - "Qualification: benchmark-specific, best of 3, CryoSegNet not best everywhere; EMPIAR-10093 text/table conflict."
      - "Transition: orientation coverage and FSC."
    source: "Dhakal et al. 2025, Table 3 and Results text; values in src/data/benchmarks.json."
    qualification: "Benchmark- and protocol-specific; best of three trials; four proteins; CryoSegNet and CryoTransformer come from the same group as the review's authors."
    deeper: "Best-of-three reporting rewards variance: a method with unstable ab initio runs can look better than its typical result. Averages over seeds with spread would be more conservative."
    question: "So which picker should I use?"
    answer: "The one that gives the best validated reconstruction on your data. Run two, compare 2D classes, orientation coverage and half-map FSC, and keep the union or the better set. Rankings from one benchmark do not transfer automatically."

  - id: s13
    title: "When these tools are useful"
    stage: pick
    target_seconds: 55
    evidence: true
    labels: [CONCEPTUAL SCHEMATIC]
    citation: "Bepler et al. 2019 · Wagner et al. 2019 · Rice et al. 2023 · Dhakal et al. 2025"
    claims: [c13-decision]
    script: |-
      So when are these tools useful?
      
      Topaz is valuable for large single-particle datasets when only a modest number of labels are available. crYOLO’s general model can provide a fast first pass during data collection. TomoTwin is attractive for locating known macromolecular shapes in crowded tomograms.
      
      A practical workflow is iterative: pick broadly, inspect the micrographs and two-dimensional classes, remove obvious contaminants, retrain if appropriate, and repick. The goal is not just to clean the dominant views, but also to preserve valid rare orientations.
      
      Simpler methods may be preferable when particles are large and obvious, when the dataset is small, or when transparent parameter control matters more than marginal speed. Template matching can produce template bias—sometimes called “Einstein from noise.” Learned pickers do not remove bias; they replace it with biases from labels, simulations, and training distributions.
    clicks:
      - "'Use AI' column."
      - "'Prefer simpler' column."
    source: "Synthesis of the method papers' stated use cases (Topaz: few labels; crYOLO: general model, on-the-fly; TomoTwin: no retraining, ≥~150 kDa)."
    qualification: "This is my synthesis, not a published decision tree."
    deeper: "A practical pattern: pick broadly with a general model, clean with 2D classification, then retrain Topaz on the clean set and re-pick to recover rare views."
    question: "Isn't template matching biased too?"
    answer: "Yes — it finds what looks like the template ('Einstein from noise'). Learned pickers trade template bias for training-set bias. Either way, validate with independent half maps."

  - id: s14
    title: "Limitations, artifacts and safeguards"
    stage: interpret
    target_seconds: 65
    evidence: true
    labels: [CONCEPTUAL SCHEMATIC, REPORTED RESULT]
    citation: "Iqbal et al. 2026 · Dhakal et al. 2025 · Rice et al. 2023 · Sanchez-Garcia et al. 2021 · Scheres & Chen 2012"
    claims: [c14-domain, c14-leakage, c14-wedge, c14-compute]
    script: |-
      What can go wrong? I group the failures into five categories.
      
      First, data shift: a new microscope, detector, ice thickness, or particle size may differ from the training data. Second, label problems: annotations are incomplete and subjective, while true particles are rare relative to background. Third, physical limitations: small particles, overlap, contamination, preferred orientation, and the tomographic missing wedge can all cause silent failures. Fourth, model behaviour: scores may be overconfident, results depend on thresholds, and enhancement can erase or exaggerate density. Finally, evaluation bias: test data may overlap with training sources, or developers may benchmark their own tools under favourable conditions.
      
      The safeguards should match those risks: test on held-out micrographs and genuinely different datasets; inspect raw data and class averages; examine orientation distributions and local resolution; preserve untouched half-maps; compare more than one method; and validate structural claims with biochemical or functional evidence whenever possible.
      
      No single metric can certify the entire pipeline.
    clicks:
      - "Failure modes, grouped: data, labels, physics, model, evaluation."
      - "Missing-wedge simulation inset (x–z slice)."
      - "Safeguards column, each paired with the failure it addresses."
    source: "Iqbal et al. 2026 (generalization, compute cost, model bias); Dhakal et al. 2025 (dataset scarcity, generalization, benchmarking); TomoTwin (size limit, 10 Å/px); presenter's missing-wedge simulation."
    qualification: "No single safeguard is sufficient; the list is ordered roughly by cost."
    deeper: "Data leakage example: if test micrographs come from the same EMPIAR entry as training micrographs, a picker can memorise ice texture and particle size, inflating F1 without generalising."
    question: "How would you detect a hallucinated density?"
    answer: "Check it in the unfiltered half maps and in the unsharpened average; check its local resolution; see if it persists with a different post-processing method; and ask whether it is chemically plausible and supported biochemically."

  - id: s15
    title: "Take-home decision framework"
    stage: interpret
    target_seconds: 40
    evidence: false
    labels: []
    citation: ""
    claims: []
    script: |-
      I want to leave you with three points.
      
      First, AI is most useful when it reduces repetitive inference while leaving the experimental evidence available for inspection.
      
      Second, cleaner does not necessarily mean more accurate. More particles, prettier density, and higher confidence can all mislead us.
      
      Third, validation must match the biological claim. For every AI step, we should be able to name an independent check that could reveal its failure.
      
      The goal is not the most picks or the prettiest map. It is to recover structural information without losing track of uncertainty—and to distinguish what is supported by the data from what is suggested by the model.
    clicks:
      - "Conclusion 1."
      - "Conclusion 2."
      - "Conclusion 3."
      - "Final line."
    source: "Synthesis of slides 7–14."
    qualification: "These are principles, not rules; context decides."
    deeper: "A useful habit: for every AI step in a pipeline, write down which independent check would catch its failure."
    question: "Will AI eventually replace the processing expert?"
    answer: "It already replaces much repetitive clicking. What it cannot replace is the judgement about whether a result answers the biological question — that requires independent evidence."

