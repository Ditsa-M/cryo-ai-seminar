meta:
  title: "AI in cryo-EM and cryo-ET data processing"
  subtitle: "Where does deep learning add trustworthy structural information — and how can we tell whether an apparent improvement is real?"
  presenter: "Ditsa Mallick"
  course: "BCH 561 · Arizona State University"
  date: "27 October 2026"
