# Claim ledger. Every quantitative or evidence-bearing statement in the script or on a slide.
# type: reported | recomputed | experimental | simulation | interpretation | definition
# status: verified (checked against the source text/data on verified_on) | flagged (see note)
# QA (scripts/qa-check.mjs) fails if a slide lists a claim id missing here, if a claim lacks a
# source, or if a 'reported' claim lacks a locator.
verified_on: "2026-10-21"
claims:
  - id: c01-empiar10017
    slide: s01
    type: experimental
    text: "Micrograph is EMPIAR-10017 β-galactosidase, Falcon II, 1.77 Å/px, unaligned average of 24 frames (24 e⁻/Å²), with manually selected coordinates by R. Henderson."
    source: empiar10017
